<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory | SchoolBook ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="d-flex admin-dashboard">

<!-- SIDEBAR -->
<aside class="sidebar text-white p-3">

    <div class="brand d-flex align-items-center gap-2 mb-4">
        <img src="../images/img.png" class="brand-logo" onerror="this.src='https://placehold.co/40'">
        <div>
            <h5 class="mb-0">SchoolBook</h5>
            <small class="text-white-50">Admin Panel</small>
        </div>
    </div>

    <nav class="nav flex-column gap-2">
        <a class="nav-link" href="admin.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link active" href="students.html"><i class="bi bi-people"></i> Students</a>
        <a class="nav-link" href="book.html"><i class="bi bi-journal-plus"></i> Add Books</a>
        <a class="nav-link" href="order.html"><i class="bi bi-cart-check"></i> Orders</a>
        <a class="nav-link" href="inventory.html"><i class="bi bi-box"></i> Inventory</a>
        <a class="nav-link" href="payment.html"><i class="bi bi-cash-stack"></i> Payments</a>
        <a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
        <a class="nav-link" href="staff-directory.html"><i class="bi bi-shield-lock"></i> Staff Access</a>
    </nav>

</aside>

<!-- MAIN CONTENT -->
<main class="content flex-grow-1 p-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Student Management</h3>
            <p class="text-muted mb-0">View registered students and details</p>
        </div>
        
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-success btn-sm" onclick="exportToExcel()">
                <i class="bi bi-file-earmark-excel-fill me-1"></i> Export Excel
            </button>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                <i class="bi bi-person-plus-fill me-1"></i> Add Student
            </button>
            <a href="../index.html" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>

    <!-- STUDENT LIST TABLE -->
    <div class="card p-3">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-people-fill text-primary me-2"></i>Registered Students</h5>
            <div class="d-flex gap-2 align-items-center w-100 w-md-auto" style="max-width: 450px;">
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input id="studentSearch" type="search" class="form-control border-start-0 bg-light" placeholder="Search students by name, roll, phone...">
                </div>
                <button class="btn btn-outline-secondary btn-sm" onclick="loadStudents()"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
        </div>

        <div class="mb-3 d-flex flex-wrap gap-2" id="classFilters">
            <button class="btn btn-sm btn-primary filter-chip active" data-class="All" onclick="filterByClass('All')">All</button>
            <button class="btn btn-sm btn-outline-primary filter-chip" data-class="Class 5" onclick="filterByClass('Class 5')">Class 5</button>
            <button class="btn btn-sm btn-outline-primary filter-chip" data-class="Class 6" onclick="filterByClass('Class 6')">Class 6</button>
            <button class="btn btn-sm btn-outline-primary filter-chip" data-class="Class 7" onclick="filterByClass('Class 7')">Class 7</button>
            <button class="btn btn-sm btn-outline-primary filter-chip" data-class="Class 8" onclick="filterByClass('Class 8')">Class 8</button>
            <button class="btn btn-sm btn-outline-primary filter-chip" data-class="Class 9" onclick="filterByClass('Class 9')">Class 9</button>
            <button class="btn btn-sm btn-outline-primary filter-chip" data-class="Class 10" onclick="filterByClass('Class 10')">Class 10</button>
        </div>

        <div id="studentsGroupContainer">
            <div class="text-center text-muted py-4">
                <div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div>
                Loading students list...
            </div>
        </div>
    </div>

</main>

</div>

<!-- ADD STUDENT MODAL -->
<div class="modal fade" id="addStudentModal" tabindex="-1" aria-labelledby="addStudentModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="addStudentModalLabel"><i class="bi bi-person-plus-fill text-primary me-2"></i>Add Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addStudentForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Student Name</label>
                        <input type="text" class="form-control" id="mStudentName" placeholder="Enter student name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Roll Number</label>
                        <input type="text" class="form-control" id="mRollNumber" placeholder="Enter roll number" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Class</label>
                        <select class="form-select" id="mStudentClass" required>
                            <option value="5">Class 5</option>
                            <option value="6" selected>Class 6</option>
                            <option value="7">Class 7</option>
                            <option value="8">Class 8</option>
                            <option value="9">Class 9</option>
                            <option value="10">Class 10</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">School Name</label>
                        <input type="text" class="form-control" id="mSchoolName" placeholder="Enter school name" value="Greenwood High" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Parent Name</label>
                        <input type="text" class="form-control" id="mParentName" placeholder="Enter parent name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phone Number</label>
                        <input type="tel" class="form-control" id="mPhoneNumber" placeholder="Enter phone number" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                        <i class="bi bi-check-circle me-1"></i> Save Student
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../js/student.js"></script>

</body>
</html>
