<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory | SchoolBook ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="d-flex admin-dashboard">

<!-- SIDEBAR -->
<aside class="sidebar text-white p-3">

    <div class="brand d-flex align-items-center gap-2 mb-4">
        <img src="../images/img.png" class="brand-logo" onerror="this.src='https://placehold.co/40'">
        <div>
            <h5 class="mb-0">SchoolBook</h5>
            <small class="text-white-50">Admin Panel</small>
        </div>
    </div>

    <nav class="nav flex-column gap-2">
        <a class="nav-link" href="admin.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link active" href="students.html"><i class="bi bi-people"></i> Students</a>
        <a class="nav-link" href="book.html"><i class="bi bi-journal-plus"></i> Add Books</a>
        <a class="nav-link" href="order.html"><i class="bi bi-cart-check"></i> Orders</a>
        <a class="nav-link" href="admin.html#inventory"><i class="bi bi-box"></i> Inventory</a>
        <a class="nav-link" href="admin.html#payments"><i class="bi bi-cash-stack"></i> Payments</a>
        <a class="nav-link" href="admin.html#reports"><i class="bi bi-bar-chart"></i> Reports</a>
    </nav>

</aside>

<!-- MAIN CONTENT -->
<main class="content flex-grow-1 p-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Student Management</h3>
            <p class="text-muted mb-0">View registered students and details</p>
        </div>
        
        <div class="d-flex align-items-center gap-3">
            <a href="../register.html" class="btn btn-primary btn-sm"><i class="bi bi-person-plus-fill me-1"></i> Register New</a>
            <a href="../login.html" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>

    <!-- STUDENT LIST TABLE -->
    <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-people-fill text-primary me-2"></i>Registered Students</h5>
            <button class="btn btn-outline-secondary btn-sm" onclick="loadStudents()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Roll No</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>School Name</th>
                        <th>Parent Name</th>
                        <th>Phone Number</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <tr>
                        <td colspan="7" class="text-center text-muted py-4">Loading students list...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

</div>

<script src="../js/student.js"></script>

</body>
</html>
