<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management | SchoolBook ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="d-flex admin-dashboard">

<!-- SIDEBAR -->
<aside class="sidebar text-white p-3">

    <div class="brand d-flex align-items-center gap-2 mb-4">
        <img src="../images/img.png" class="brand-logo" onerror="this.src='https://placehold.co/40'">
        <div>
            <h5 class="mb-0">SchoolBook</h5>
            <small class="text-white-50">Admin Panel</small>
        </div>
    </div>

    <nav class="nav flex-column gap-2">
        <a class="nav-link" href="admin.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link" href="students.html"><i class="bi bi-people"></i> Students</a>
        <a class="nav-link active" href="book.html"><i class="bi bi-journal-plus"></i> Add Books</a>
        <a class="nav-link" href="order.html"><i class="bi bi-cart-check"></i> Orders</a>
        <a class="nav-link" href="admin.html#inventory"><i class="bi bi-box"></i> Inventory</a>
        <a class="nav-link" href="admin.html#payments"><i class="bi bi-cash-stack"></i> Payments</a>
        <a class="nav-link" href="admin.html#reports"><i class="bi bi-bar-chart"></i> Reports</a>
    </nav>

</aside>

<!-- MAIN CONTENT -->
<main class="content flex-grow-1 p-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Book & Class List Management</h3>
            <p class="text-muted mb-0">Add class-wise book lists and manage curriculum textbooks</p>
        </div>
        <div>
            <a href="../login.html" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>

    <div class="row g-4">
        <!-- ADD BOOK FORM -->
        <div class="col-md-5">
            <div class="card p-3 shadow-sm">
                <h5 class="mb-3 fw-bold"><i class="bi bi-journal-plus text-primary me-2"></i>Add Class Textbook</h5>
                
                <div class="mb-2">
                    <label class="form-label small fw-bold text-muted">Target Class</label>
                    <input id="bookClass" class="form-control mb-2" placeholder="Class (e.g. 5, 6, 7...)">
                </div>
                <div class="mb-2">
                    <label class="form-label small fw-bold text-muted">Book Name</label>
                    <input id="bookName" class="form-control mb-2" placeholder="Book Title">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Initial Quantity</label>
                    <input id="bookQty" class="form-control mb-2" placeholder="Quantity in Stock">
                </div>

                <button class="btn btn-primary w-100" onclick="addBook()">
                    ➕ Add Book
                </button>
            </div>
        </div>

        <!-- BOOK INVENTORY LIST -->
        <div class="col-md-7">
            <div class="card p-3 shadow-sm">
                <h5 class="mb-3 fw-bold"><i class="bi bi-book-half text-success me-2"></i>Class Textbook Lists</h5>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Class</th>
                                <th>Book Name</th>
                                <th>Quantity</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bookTableBody">
                            <tr>
                                <td colspan="4" class="text-center text-muted">Loading textbooks...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</main>

</div>

<script src="../js/Book.js"></script>

</body>
</html>
