<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management | SchoolBook ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<div class="d-flex admin-dashboard">

<!-- SIDEBAR -->
<aside class="sidebar text-white p-3">

    <div class="brand d-flex align-items-center gap-2 mb-4">
        <img src="../images/img.png" class="brand-logo" onerror="this.src='https://placehold.co/40'">
        <div>
            <h5 class="mb-0">SchoolBook</h5>
            <small class="text-white-50">Admin Panel</small>
        </div>
    </div>

    <nav class="nav flex-column gap-2">
        <a class="nav-link" href="admin.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link" href="students.html"><i class="bi bi-people"></i> Students</a>
        <a class="nav-link" href="book.html"><i class="bi bi-journal-plus"></i> Add Books</a>
        <a class="nav-link active" href="order.html"><i class="bi bi-cart-check"></i> Orders</a>
        <a class="nav-link" href="inventory.html"><i class="bi bi-box"></i> Inventory</a>
        <a class="nav-link" href="payment.html"><i class="bi bi-cash-stack"></i> Payments</a>
        <a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
        <a class="nav-link" href="staff-directory.html"><i class="bi bi-shield-lock"></i> Staff Access</a>
    </nav>

</aside>

<!-- MAIN CONTENT -->
<main class="content flex-grow-1 p-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Student Order Directory</h3>
            <p class="text-muted mb-0">Track student orders, verify status, and manage deliveries</p>
        </div>
        <div>
            <a href="../index.html" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>

    <!-- ORDERS LIST TABLE -->
    <div class="card p-3 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-cart-check-fill text-primary me-2"></i>All Orders</h5>
            <button class="btn btn-outline-secondary btn-sm" onclick="loadOrders()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Parent Name</th>
                        <th>Books List</th>
                        <th>Total Amount</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTable">
                    <tr>
                        <td colspan="6" class="text-center text-muted">Loading orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

</div>

<!-- RECEIPT MODAL -->
<div class="modal fade" id="receiptModal" tabindex="-1" aria-labelledby="receiptModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-dark">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold" id="receiptModalLabel"><i class="bi bi-receipt me-2"></i>Payment Receipt</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4" id="receiptModalBody">
                <!-- Dynamic content will be inserted by JS -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-success" onclick="window.print()"><i class="bi bi-printer me-1"></i> Print Receipt</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/order.js"></script>

</body>
</html>
