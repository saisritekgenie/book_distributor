<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | SchoolBook ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="d-flex admin-dashboard">

<!-- SIDEBAR -->
<aside class="sidebar text-white p-3">
    <div class="brand d-flex align-items-center gap-2 mb-4">
        <img src="../images/img.png" class="brand-logo" onerror="this.src='https://placehold.co/40'">
        <div>
            <h5 class="mb-0">SchoolBook</h5>
            <small class="text-white-50">Admin Panel</small>
        </div>
    </div>
    <nav class="nav flex-column gap-2">
        <a class="nav-link" href="admin.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a class="nav-link" href="students.html"><i class="bi bi-people"></i> Students</a>
        <a class="nav-link" href="book.html"><i class="bi bi-journal-plus"></i> Add Books</a>
        <a class="nav-link" href="order.html"><i class="bi bi-cart-check"></i> Orders</a>
        <a class="nav-link active" href="inventory.html"><i class="bi bi-box"></i> Inventory</a>
        <a class="nav-link" href="payment.html"><i class="bi bi-cash-stack"></i> Payments</a>
        <a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> Reports</a>
        <a class="nav-link" href="staff-directory.html"><i class="bi bi-shield-lock"></i> Staff Access</a>
    </nav>
</aside>

<!-- MAIN CONTENT -->
<main class="content flex-grow-1 p-4">
    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="mb-1">Inventory Management</h3>
            <p class="text-muted mb-0">Track real-time textbook stock levels and availability</p>
        </div>
        <div>
            <a href="../index.html" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>

    <!-- INVENTORY TABLE -->
    <div class="card p-3 shadow-sm border-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-box-fill text-primary me-2"></i>Stock Inventory</h5>
            <button class="btn btn-outline-secondary btn-sm" onclick="loadInventoryTable()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Book / Subject</th>
                        <th>Available Stock</th>
                        <th>Minimum Limit</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <tr>
                        <td colspan="4" class="text-center text-muted">Loading inventory items...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
