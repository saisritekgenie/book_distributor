<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | SchoolBook ERP</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e8f5e9 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --border-color: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Glowing Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.5;
            animation: floating 10s infinite alternate ease-in-out;
        }
        .blob-1 {
            width: 300px;
            height: 300px;
            background: #c7d2fe;
            top: 5%;
            left: 10%;
        }
        .blob-2 {
            width: 350px;
            height: 350px;
            background: #a7f3d0;
            bottom: 5%;
            right: 10%;
            animation-delay: -4s;
        }
        @keyframes floating {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Outfit', sans-serif;
        }

        .register-card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            width: 100%;
            max-width: 580px;
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(12px);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .register-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 50px -15px rgba(0, 0, 0, 0.1);
        }

        .register-header {
            background: var(--primary-gradient);
            padding: 35px 30px;
            color: white;
            text-align: center;
            position: relative;
        }

        .logo-badge {
            width: 55px;
            height: 55px;
            line-height: 55px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 12px;
            font-size: 1.8rem;
        }

        /* Form Custom Elements */
        .form-label {
            color: var(--text-primary);
            font-weight: 550;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .input-group-custom {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.25s ease;
            background: white;
        }

        .input-group-custom:focus-within {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .input-group-custom .input-group-text {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            padding-left: 16px;
        }

        .input-group-custom .form-control {
            border: none;
            padding: 11px 14px;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .input-group-custom .form-control:focus {
            box-shadow: none;
            outline: none;
        }

        /* Buttons */
        .btn-register {
            background: var(--success-gradient);
            border: none;
            font-size: 1rem;
            transition: all 0.25s ease;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(16, 185, 129, 0.3) !important;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1060;
        }

        .nav-tabs .nav-link.active {
            color: #4f46e5 !important;
            border-bottom: 3px solid #4f46e5 !important;
            background: transparent !important;
        }
        .nav-tabs .nav-link:hover {
            color: #4f46e5 !important;
        }
    </style>
</head>
<body>

    <!-- Ambient Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="toast-container" id="toast-container"></div>

    <div class="register-card shadow-lg">
        <div class="register-header">
            <div class="logo-badge">📚</div>
            <h3 class="fw-bold mb-1">Student Portal</h3>
            <p class="mb-0 opacity-75 small">Register a new account or log in to order textbooks</p>
        </div>

        <ul class="nav nav-tabs justify-content-center border-bottom-0 mt-3" id="studentTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold text-secondary border-0 bg-transparent px-4 py-2" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab" aria-controls="register-panel" aria-selected="true" style="border-bottom: 3px solid transparent !important;">
                    <i class="bi bi-person-plus me-1"></i> Register
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold text-secondary border-0 bg-transparent px-4 py-2" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab" aria-controls="login-panel" aria-selected="false" style="border-bottom: 3px solid transparent !important;">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </li>
        </ul>
        
        <div class="card-body p-4 p-sm-5 pt-2">
            <div class="tab-content" id="studentTabContent">
                <!-- REGISTER PANEL -->
                <div class="tab-pane fade show active" id="register-panel" role="tabpanel" aria-labelledby="register-tab">
                    <form id="registerForm" onsubmit="event.preventDefault(); registerStudent();">
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label" for="studentName">Student Full Name</label>
                                <div class="input-group input-group-custom">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="studentName" placeholder="John Doe" required>
                                </div>
                            </div>
                            
                            <div class="col-sm-6">
                                <label class="form-label" for="rollNumber">Roll Number / ID</label>
                                <div class="input-group input-group-custom">
                                    <span class="input-group-text"><i class="bi bi-hash"></i></span>
                                    <input type="text" class="form-control" id="rollNumber" placeholder="R101" required>
                                </div>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label" for="studentClass">Class Grade</label>
                                <div class="input-group input-group-custom">
                                    <span class="input-group-text"><i class="bi bi-mortarboard"></i></span>
                                    <select class="form-select border-0 ps-3" id="studentClass" style="box-shadow: none;" required>
                                        <option value="5">Class 5 (₹)</option>
                                        <option value="6" selected>Class 6 (₹)</option>
                                        <option value="7">Class 7 (₹)</option>
                                        <option value="8">Class 8 (₹)</option>
                                        <option value="9">Class 9 (₹)</option>
                                        <option value="10">Class 10 (₹)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label" for="schoolName">School Name</label>
                                <div class="input-group input-group-custom">
                                    <span class="input-group-text"><i class="bi bi-building"></i></span>
                                    <input type="text" class="form-control" id="schoolName" placeholder="Greenwood High" required>
                                </div>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label" for="parentName">Parent / Guardian Name</label>
                                <div class="input-group input-group-custom">
                                    <span class="input-group-text"><i class="bi bi-people"></i></span>
                                    <input type="text" class="form-control" id="parentName" placeholder="Mr. Doe" required>
                                </div>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label" for="phoneNumber">Contact Mobile</label>
                                <div class="input-group input-group-custom">
                                    <span class="input-group-text"><i class="bi bi-phone"></i></span>
                                    <input type="tel" class="form-control" id="phoneNumber" placeholder="9876543210" required>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-register w-100 py-2.5 text-white fw-bold rounded-3 shadow">
                                <i class="bi bi-check-circle me-1"></i> Register Student
                            </button>
                        </div>
                    </form>
                </div>

                <!-- LOGIN PANEL -->
                <div class="tab-pane fade" id="login-panel" role="tabpanel" aria-labelledby="login-tab">
                    <form id="studentLoginForm" onsubmit="event.preventDefault(); studentLogin();">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label" for="loginStudentName">Student Full Name</label>
                                <div class="input-group input-group-custom">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="loginStudentName" placeholder="e.g. John Doe" required>
                                </div>
                            </div>
                            
                            <div class="col-12">
                                <label class="form-label" for="loginParentMobile">Parent Contact Mobile</label>
                                <div class="input-group input-group-custom">
                                    <span class="input-group-text"><i class="bi bi-phone"></i></span>
                                    <input type="tel" class="form-control" id="loginParentMobile" placeholder="e.g. 9876543210" required>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-register w-100 py-2.5 text-white fw-bold rounded-3 shadow" style="background: var(--primary-gradient);">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Student Sign In
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <p class="mb-0 text-muted small">Are you an Admin or Staff? 
                    <a href="login.html" class="fw-bold text-primary text-decoration-none ms-1">Sign In Here</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.registerStudent = function() {
            const studentName = document.getElementById("studentName").value.trim();
            const rollNumber = document.getElementById("rollNumber").value.trim();
            const studentClass = document.getElementById("studentClass").value.trim();
            const schoolName = document.getElementById("schoolName").value.trim();
            const parentName = document.getElementById("parentName").value.trim();
            const phoneNumber = document.getElementById("phoneNumber").value.trim();

            if (!studentName || !rollNumber || !studentClass || !schoolName || !parentName || !phoneNumber) {
                alert("Please fill in all fields.");
                return;
            }

            const student = {
                studentName: studentName,
                rollNumber: rollNumber,
                studentClass: studentClass,
                schoolName: schoolName,
                parentName: parentName,
                phoneNumber: phoneNumber
            };

            // Save to localStorage
            localStorage.setItem("parentName", parentName);
            localStorage.setItem("studentName", studentName);
            localStorage.setItem("studentClass", studentClass);
            localStorage.setItem("schoolName", schoolName);
            localStorage.setItem("rollNumber", rollNumber);
            localStorage.setItem("phoneNumber", phoneNumber);
            localStorage.setItem("email", parentName.toLowerCase().replace(/\s+/g, '') + "@gmail.com"); // mock login credential
            localStorage.setItem("password", "parent123"); // default parent password

            // Clear old cart and wishlist to ensure a clean new dashboard
            localStorage.removeItem("cart");
            localStorage.removeItem("wishlist");

            let studentsList = JSON.parse(localStorage.getItem("students")) || [];
            studentsList.push(student);
            localStorage.setItem("students", JSON.stringify(studentsList));

            // Send to backend database if online
            fetch("http://localhost:8081/api/students", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    studentName: studentName,
                    className: "Grade " + studentClass,
                    section: "A",
                    parentMobile: phoneNumber
                })
            })
            .then(res => {
                if (!res.ok) throw new Error("API post failed");
                return res.json();
            })
            .then(savedStudent => {
                console.log("Student saved to backend database:", savedStudent);
                if (savedStudent && savedStudent.studentId) {
                    localStorage.setItem("studentId", savedStudent.studentId);
                }
            })
            .catch(err => {
                console.warn("Spring Boot backend offline, student saved locally only", err);
            });

            alert("Registration Successful! Redirecting you directly to the SchoolBook Textbook Portal...");
            window.location.href = "parent/parent.html";
        };

        window.studentLogin = function() {
            const studentName = document.getElementById("loginStudentName").value.trim();
            const parentMobile = document.getElementById("loginParentMobile").value.trim();

            if (!studentName || !parentMobile) {
                alert("Please fill in both fields.");
                return;
            }

            let students = JSON.parse(localStorage.getItem("students")) || [];
            let matchedStudent = students.find(s => 
                s.studentName && s.studentName.toLowerCase().trim() === studentName.toLowerCase().trim() &&
                s.phoneNumber && s.phoneNumber.trim() === parentMobile.trim()
            );

            if (matchedStudent) {
                localStorage.setItem("parentName", matchedStudent.parentName);
                localStorage.setItem("studentName", matchedStudent.studentName);
                localStorage.setItem("studentClass", matchedStudent.studentClass);
                localStorage.setItem("schoolName", matchedStudent.schoolName);
                localStorage.setItem("rollNumber", matchedStudent.rollNumber);
                localStorage.setItem("phoneNumber", matchedStudent.phoneNumber);
                localStorage.setItem("email", (matchedStudent.parentName || "").toLowerCase().replace(/\s+/g, '') + "@gmail.com");
                localStorage.setItem("password", "parent123");

                alert("Login Successful! Redirecting to Portal...");
                window.location.href = "parent/parent.html";
            } else {
                fetch("http://localhost:8081/api/students")
                .then(res => res.json())
                .then(dbStudents => {
                    let dbMatch = dbStudents.find(dbS => 
                        dbS.studentName && dbS.studentName.toLowerCase().trim() === studentName.toLowerCase().trim() &&
                        dbS.parentMobile && dbS.parentMobile.trim() === parentMobile.trim()
                    );
                    if (dbMatch) {
                        let roll = "R" + dbMatch.studentId;
                        localStorage.setItem("parentName", dbMatch.studentName + " Parent");
                        localStorage.setItem("studentName", dbMatch.studentName);
                        localStorage.setItem("studentClass", dbMatch.className.replace("Grade ", ""));
                        localStorage.setItem("schoolName", "Greenwood High");
                        localStorage.setItem("rollNumber", roll);
                        localStorage.setItem("phoneNumber", dbMatch.parentMobile);
                        localStorage.setItem("email", dbMatch.studentName.toLowerCase().replace(/\s+/g, '') + "@gmail.com");
                        localStorage.setItem("password", "parent123");

                        let localList = JSON.parse(localStorage.getItem("students")) || [];
                        if (!localList.some(s => s.studentName.toLowerCase().trim() === dbMatch.studentName.toLowerCase().trim())) {
                            localList.push({
                                studentName: dbMatch.studentName,
                                rollNumber: roll,
                                studentClass: dbMatch.className.replace("Grade ", ""),
                                schoolName: "Greenwood High",
                                parentName: dbMatch.studentName + " Parent",
                                phoneNumber: dbMatch.parentMobile
                            });
                            localStorage.setItem("students", JSON.stringify(localList));
                        }

                        alert("Login Successful! Redirecting to Portal...");
                        window.location.href = "parent/parent.html";
                    } else {
                        alert("Invalid student name or parent mobile number.");
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Invalid student name or parent mobile number.");
                });
            }
        };
    </script>
</body>
</html>
