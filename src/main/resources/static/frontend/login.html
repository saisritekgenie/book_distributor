<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login | SchoolBook ERP</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Login Custom Style -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-wrapper d-flex align-items-center justify-content-center">
    <!-- Decorative Ambient Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="login-card p-4 p-sm-5 shadow-lg border-0">
        <!-- Logo Header -->
        <div class="text-center mb-4">
            <div class="logo-icon mb-2">
                <span class="fs-2">📚</span>
            </div>
            <h2 class="fw-bold mb-1 header-title">Admin & Staff</h2>
            <p class="text-muted small">Access your Distribution Management System</p>
        </div>

        <!-- Form Elements -->
        <div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary" for="username">Username / Email</label>
                <div class="input-group input-group-custom">
                    <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-person text-secondary"></i></span>
                    <input type="text" id="username" class="form-control border-start-0 ps-0" placeholder="admin@school.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary" for="password">Password</label>
                <div class="input-group input-group-custom">
                    <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                    <input type="password" id="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Forgot Password -->
            <div class="text-end mb-4 text-secondary small">
                <a href="forgot-password.html" class="forgot-link text-primary text-decoration-none">Forgot Password?</a>
            </div>

            <!-- Submit Button -->
            <button type="button" class="btn btn-login w-100 py-2.5 fw-bold text-white rounded-3 mb-3 shadow" onclick="login()">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </div>

        <!-- Footer Links -->
        <div class="text-center mt-4">
            <p class="mb-0 text-muted small">Are you a Student/Parent? 
                <a href="register.html" class="fw-bold text-primary text-decoration-none ms-1">Go to Student Portal</a>
            </p>
        </div>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
