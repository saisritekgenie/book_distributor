<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fb;
        }

        .cart-card{
            border:none;
            border-radius:15px;
        }

        .book-image{
            width:70px;
            height:90px;
            object-fit:cover;
            border-radius:8px;
        }

        .total-box{
            background:#0d6efd;
            color:white;
            border-radius:15px;
            padding:20px;
        }
    </style>

</head>
<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-cart-fill"></i>
            My Cart
        </h2>

        <a href="parent.html" class="btn btn-secondary">
            Continue Shopping
        </a>

    </div>

    <div class="row">

        <!-- CART ITEMS -->

        <div class="col-lg-8">

            <div class="card cart-card shadow">

                <div class="card-body">

                    <table class="table align-middle">

                        <thead>

                        <tr>

                            <th>Book</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th></th>

                        </tr>

                        </thead>

                        <tbody id="cartTable"></tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- SUMMARY -->

        <div class="col-lg-4">

            <div class="total-box shadow">

                <h4>Order Summary</h4>

                <hr>

                <p>Total Books :
                    <strong id="bookCount">0</strong>
                </p>

                <p>Total Amount :
                    ₹<strong id="grandTotal">0</strong>
                </p>

                <a href="payment.html"
                   class="btn btn-warning w-100 mt-3">

                    Proceed To Payment

                </a>

            </div>

        </div>

    </div>

</div>

<script src="../js/cart.js"></script>

</body>
</html>
