<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SchoolBook</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/parent.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="parent.html">
            📚 SchoolBook Portal
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="profile.html" class="btn btn-light btn-sm me-2">
                <i class="bi bi-person-circle me-1"></i> Profile
            </a>
            <a href="cart.html" class="btn btn-outline-light btn-sm position-relative me-2">
                <i class="bi bi-cart3 me-1"></i> Cart
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="headerCartBadge">0</span>
            </a>
            <a href="my-orders.html" class="btn btn-outline-light btn-sm me-3">
                <i class="bi bi-bag-check me-1"></i> My Orders
            </a>
            <a href="../index.html" class="btn btn-light btn-sm fw-semibold">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <!-- BACK LINK -->
            <div class="mb-4">
                <a href="parent.html" class="text-decoration-none text-muted small fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Bookstore
                </a>
            </div>

            <!-- PROFILE CARD -->
            <div class="card p-4 p-md-5 shadow-sm border-0 bg-white rounded-4">
                <!-- AVATAR HEADER -->
                <div class="text-center mb-4 pb-2 border-bottom">
                    <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle fw-bold mb-3 shadow" style="width: 80px; height: 80px; font-size: 2.2rem; font-family: 'Outfit', sans-serif;">
                        👤
                    </div>
                    <h3 class="fw-bold mb-1" id="profileHeaderName">Parent Profile</h3>
                    <p class="text-muted small">Update your contact information and associated student details</p>
                </div>

                <!-- PROFILE FORM -->
                <div>
                    <!-- PARENT DETAILS -->
                    <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-person me-1 text-primary"></i> Parent Details</h5>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Parent Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person-fill"></i></span>
                            <input type="text" id="name" class="form-control bg-light border-start-0" placeholder="e.g. Rajesh Kumar">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-semibold text-secondary">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope-fill"></i></span>
                                <input type="email" id="email" class="form-control bg-light border-start-0" placeholder="parent@mail.com">
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-semibold text-secondary">Mobile Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-telephone-fill"></i></span>
                                <input type="text" id="mobile" class="form-control bg-light border-start-0" placeholder="e.g. +91 9876543210">
                            </div>
                        </div>
                    </div>

                    <hr class="my-4 text-muted">

                    <!-- STUDENT DETAILS -->
                    <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-mortarboard me-1 text-success"></i> Associated Student</h5>

                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label small fw-semibold text-secondary">Student Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person-badge"></i></span>
                                <input type="text" id="studentName" class="form-control bg-light border-start-0" placeholder="e.g. Aman Kumar">
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label small fw-semibold text-secondary">Grade Class</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-book"></i></span>
                                <input type="text" id="className" class="form-control bg-light border-start-0" placeholder="e.g. 6">
                            </div>
                        </div>
                    </div>

                    <!-- SAVE ACTION BUTTON -->
                    <div class="mt-4 pt-2">
                        <button onclick="saveProfile()" class="btn btn-success w-100 py-2.5 fw-bold text-white shadow rounded-3">
                            <i class="bi bi-floppy-fill me-1"></i> Save Profile Details
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/profile.js"></script>
<script>
    // Simple script to update header name live
    document.getElementById("name").addEventListener("input", function() {
        let val = this.value.trim();
        document.getElementById("profileHeaderName").textContent = val ? val : "Parent Profile";
    });
    // Load cart badge quantity
    function updateHeaderBadge() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let badge = document.getElementById("headerCartBadge");
        if (badge) {
            let totalQty = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            badge.innerText = totalQty;
        }
    }
    updateHeaderBadge();
</script>
</body>
</html>
