<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/parent.css">
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            📚 School Book Management
        </a>

        <div class="ms-auto d-flex align-items-center">

            <span class="text-white me-3">
                Welcome Parent
            </span>

            <a href="../login.html" class="btn btn-light btn-sm">
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container-fluid mt-4">

<div class="row">

<!-- LEFT SIDE -->

<div class="col-lg-9">

<div class="card shadow-sm mb-4">

<div class="card-body">

<h3 class="fw-bold">

Parent Dashboard

</h3>

<p class="text-muted">

Select your child's class and order textbooks.

</p>

<hr>

<label class="fw-bold mb-2">

Select Class

</label>

<select id="classSelect" class="form-select w-25">

<option value="5">Class 5</option>

<option value="6" selected>Class 6</option>

<option value="7">Class 7</option>

<option value="8">Class 8</option>

<option value="9">Class 9</option>

<option value="10">Class 10</option>

</select>

</div>

</div>

<!-- COMPLETE PACKAGE -->

<div class="card shadow mb-4 border-primary">

<div class="card-header bg-primary text-white">

<h5 id="packageTitle">

📦 Complete Package

</h5>

</div>

<div class="card-body">

<p>

✔ English

<br>

✔ Mathematics

<br>

✔ Science

<br>

✔ Social

<br>

✔ Telugu

<br>

✔ Hindi

</p>

<h3
class="text-success"
id="packagePrice">

₹0

</h3>

<button
class="btn btn-success"
id="buyPackage">

Buy Complete Package

</button>

</div>

</div>

<!-- BOOKS -->

<h4 class="mb-3">

📚 Individual Books

</h4>

<div
class="row"
id="bookContainer">

</div>

</div>
<!-- SHOPPING CART -->

<div class="col-lg-3">

    <div class="card shadow sticky-top">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">
                🛒 Shopping Cart
            </h5>

        </div>

        <div class="card-body">

            <ul
                class="list-group mb-3"
                id="cartItems">

            </ul>

            <h4>

                Total :

                ₹<span id="cartTotal">0</span>

            </h4>

            <a
                href="cart.html"
                class="btn btn-success w-100 mt-3">

                Proceed to Cart

            </a>

        </div>

    </div>

</div>

</div>

</div>

<script src="../js/parent.js"></script>

</body>
</html>
