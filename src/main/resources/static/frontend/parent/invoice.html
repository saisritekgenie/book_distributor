<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice & QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8f5e9 100%);
            min-height: 100vh;
        }
        h1, h2, h3, h4, h5 { font-family: 'Outfit', sans-serif; }
        .invoice-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .invoice-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
        }
        .table th {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            color: #475569;
            background-color: #f8fafc;
        }
        .qr-section {
            border: 2px dashed #10b981;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            background: #f0fdf4;
        }
        .status-badge-paid {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
        }
        .status-badge-pending {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <!-- Invoice Card -->
            <div class="card invoice-card mb-4">
                <div class="invoice-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h2 class="fw-bold mb-1"><i class="bi bi-receipt-cutoff me-2"></i>Invoice</h2>
                            <p class="mb-0 opacity-75">School Book Management System</p>
                        </div>
                        <div class="text-end">
                            <h5 class="mb-1" id="invoiceIdDisplay">-</h5>
                            <small id="invoiceDateDisplay">-</small>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">

                    <!-- Parent/Student Info -->
                    <div class="row mb-4">
                        <div class="col-6">
                            <p class="mb-1 text-muted small">Parent Name</p>
                            <h6 class="fw-bold" id="invParent">-</h6>
                        </div>
                        <div class="col-6">
                            <p class="mb-1 text-muted small">Student Name</p>
                            <h6 class="fw-bold" id="invStudent">-</h6>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-6">
                            <p class="mb-1 text-muted small">Order ID</p>
                            <h6 class="fw-bold" id="invOrderId">-</h6>
                        </div>
                        <div class="col-6">
                            <p class="mb-1 text-muted small">Payment</p>
                            <span id="invPaymentBadge">-</span>
                        </div>
                    </div>

                    <hr>

                    <!-- Books Table -->
                    <h5 class="fw-bold mb-3">Ordered Books</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Book Name</th>
                                    <th class="text-end">Price</th>
                                </tr>
                            </thead>
                            <tbody id="invoiceBooksBody">
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="2" class="text-end fw-bold fs-5">Total:</td>
                                    <td class="text-end fw-bold fs-5 text-success" id="invTotal">₹0</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                </div>
            </div>

            <!-- QR Code Section -->
            <div class="qr-section mb-4">
                <h4 class="fw-bold text-success mb-3"><i class="bi bi-qr-code me-2"></i>Book Collection QR Code</h4>
                <div id="qrcode" class="d-flex justify-content-center mb-3"></div>
                <p class="text-muted mb-0">Show this QR code to the school staff to collect your books.</p>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-3 justify-content-center">
                <a href="parent.html" class="btn btn-primary rounded-3 px-4 py-2">
                    <i class="bi bi-house me-2"></i>Back to Dashboard
                </a>
                <a href="my-orders.html" class="btn btn-outline-secondary rounded-3 px-4 py-2">
                    <i class="bi bi-box-seam me-2"></i>My Orders
                </a>
                <button class="btn btn-outline-success rounded-3 px-4 py-2" onclick="window.print()">
                    <i class="bi bi-printer me-2"></i>Print Invoice
                </button>
            </div>

        </div>
    </div>

</div>

<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
    // =============================================
    // LOAD LATEST INVOICE FROM LOCALSTORAGE
    // =============================================
    document.addEventListener("DOMContentLoaded", () => {

        const invoice = JSON.parse(localStorage.getItem("latestInvoice"));

        if (!invoice) {
            document.querySelector(".card-body").innerHTML = `
                <div class="text-center text-muted py-5">
                    <i class="bi bi-exclamation-circle fs-1 d-block mb-2"></i>
                    No invoice found. Please place an order first.
                </div>`;
            return;
        }

        // Fill Invoice Details
        document.getElementById("invoiceIdDisplay").textContent = invoice.invoiceId || "-";
        document.getElementById("invoiceDateDisplay").textContent = invoice.invoiceDate || "-";
        document.getElementById("invParent").textContent = invoice.parentName || "-";
        document.getElementById("invStudent").textContent = invoice.studentName || "-";
        document.getElementById("invOrderId").textContent = invoice.orderId || "-";

        // Payment Badge
        const badgeEl = document.getElementById("invPaymentBadge");
        if (invoice.paymentStatus === "Paid") {
            badgeEl.innerHTML = `<span class="status-badge-paid">${invoice.paymentMethod || "-"} — Paid</span>`;
        } else {
            badgeEl.innerHTML = `<span class="status-badge-pending">${invoice.paymentMethod || "-"} — Pending</span>`;
        }

        // Books Table
        const tbody = document.getElementById("invoiceBooksBody");
        const books = invoice.books || [];

        if (books.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">No books in this order</td></tr>`;
        } else {
            tbody.innerHTML = books.map((b, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${b.name || "-"}</strong></td>
                    <td class="text-end">₹${b.price || 0}</td>
                </tr>
            `).join("");
        }

        // Total
        document.getElementById("invTotal").textContent = "₹" + (invoice.totalAmount || 0);

        // Generate QR Code
        const qrDiv = document.getElementById("qrcode");
        qrDiv.innerHTML = "";
        const qrData = invoice.orderId || "-";

        new QRCode(qrDiv, {
            text: qrData,
            width: 150,
            height: 150,
            colorDark: "#1e293b",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.L
        });
    });
</script>

</body>
</html>
