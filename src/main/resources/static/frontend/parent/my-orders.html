<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | SchoolBook</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="../css/parent.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="parent.html">
            📚 SchoolBook Portal
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="cart.html" class="btn btn-outline-light btn-sm position-relative me-2">
                <i class="bi bi-cart3 me-1"></i> Cart
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="headerCartBadge">0</span>
            </a>
            <a href="my-orders.html" class="btn btn-light btn-sm me-3">
                <i class="bi bi-bag-check me-1"></i> My Orders
            </a>
            <a href="../index.html" class="btn btn-light btn-sm fw-semibold">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <!-- PAGE TITLE -->
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h2 class="fw-bold mb-1">My Orders History</h2>
                    <p class="text-muted mb-0">Track and view payment invoices of textbook packages ordered for your students.</p>
                </div>
                <a href="parent.html" class="btn btn-primary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Order More Books
                </a>
            </div>

            <!-- MAIN CONTAINER FOR ORDERS -->
            <div id="ordersContainer">
                <!-- Dynamic Content (Table Card or Empty State Card) -->
                <div class="card p-5 text-center shadow-sm border-0">
                    <div class="spinner-border text-primary mx-auto mb-3" role="status"></div>
                    <p class="text-muted mb-0">Loading your orders history...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/my-orders.js"></script>
</body>
</html>
