<!DOCTYPE html>
<html>
<head>
    <title>Staff Login</title>
</head>
<body>

<h2>Staff Login</h2>

<input type="text" id="username" placeholder="Staff Username">

<input type="password" id="password" placeholder="Password">

<button onclick="staffLogin()">Login</button>

<script>
function staffLogin(){
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (username === "staff" && password === "staff123") {
        window.location.href = "admin/staff.html";
        return;
    }

    let staffList = JSON.parse(localStorage.getItem("staff")) || [];
    let activeStaff = staffList.find(s => s.username === username && s.password === password && s.status === "active");

    if (activeStaff) {
        window.location.href = "admin/staff.html";
        return;
    }

    alert("Invalid Credentials or Account Suspended");
}
</script>

</body>
</html>
